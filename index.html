<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economaat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Economaat</h1>
  <a href="admin.html" class="admin-link">Beheer</a>
</header>

<main>
  <div class="section-label">Producten</div>
  <div id="productGrid"></div>

  <div class="section-label">Team</div>
  <input type="text" id="teamInput" placeholder="Naam van je team">

  <div class="section-label">Levering</div>
  <div class="row2">
    <div class="pick" data-delivery="levering">Laten leveren</div>
    <div class="pick" data-delivery="afhalen">Zelf afhalen</div>
  </div>

  <button class="submit" id="submitBtn" disabled>Bestelling plaatsen</button>
  <div class="toast" id="toast">Bestelling ontvangen.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let products = [];
// selections: { productId: quantity }
let selections = {};
let selectedDelivery = null;

const productGrid = document.getElementById('productGrid');
const teamInput = document.getElementById('teamInput');
const submitBtn = document.getElementById('submitBtn');
const toast = document.getElementById('toast');

async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('created_at');
  if(error){ console.error(error); return; }
  products = data;
  renderProducts();
}

function renderProducts(){
  productGrid.innerHTML = '';
  if(products.length === 0){
    productGrid.innerHTML = '<div class="empty">Nog geen producten beschikbaar.</div>';
    return;
  }
  products.forEach(p => {
    const isSelected = selections.hasOwnProperty(p.id);
    const row = document.createElement('div');
    row.className = 'pick-row' + (isSelected ? ' selected' : '');
    row.innerHTML = `
      <label>
        <input type="checkbox" ${isSelected ? 'checked' : ''}>
        ${escapeHtml(p.name)}
      </label>
      <input type="number" class="qty-input" min="1" value="${isSelected ? selections[p.id] : 1}">
    `;
    const checkbox = row.querySelector('input[type=checkbox]');
    const qtyInput = row.querySelector('.qty-input');

    checkbox.onchange = () => {
      if(checkbox.checked){
        selections[p.id] = parseInt(qtyInput.value) || 1;
      } else {
        delete selections[p.id];
      }
      renderProducts();
      checkReady();
    };
    qtyInput.oninput = () => {
      const val = Math.max(1, parseInt(qtyInput.value) || 1);
      if(selections.hasOwnProperty(p.id)){
        selections[p.id] = val;
      }
    };
    productGrid.appendChild(row);
  });
}

document.querySelectorAll('[data-delivery]').forEach(el => {
  el.onclick = () => {
    selectedDelivery = el.dataset.delivery;
    document.querySelectorAll('[data-delivery]').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    checkReady();
  };
});

teamInput.oninput = checkReady;

function checkReady(){
  const hasProducts = Object.keys(selections).length > 0;
  submitBtn.disabled = !(hasProducts && selectedDelivery && teamInput.value.trim());
}

submitBtn.onclick = async () => {
  const items = Object.entries(selections).map(([productId, qty]) => {
    const product = products.find(p => p.id === productId);
    return { name: product ? product.name : 'onbekend', quantity: qty };
  });
  if(items.length === 0) return;

  submitBtn.disabled = true;

  const { error } = await sb.from('orders').insert({
    items: items,
    team: teamInput.value.trim(),
    delivery: selectedDelivery
  });

  if(error){
    console.error(error);
    alert('Bestelling plaatsen is mislukt, probeer opnieuw.');
    checkReady();
    return;
  }

  selections = {};
  selectedDelivery = null;
  teamInput.value = '';
  document.querySelectorAll('[data-delivery]').forEach(x => x.classList.remove('selected'));
  renderProducts();

  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2500);
};

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadProducts();
</script>

</body>
</html>
